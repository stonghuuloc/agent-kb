name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, full history + fresh CodeQL queries

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan full git history
        # A PR cannot hide its own leak: the ignore list comes from the base branch, inline `gitleaks:allow`
        # is ignored, --text defeats `-diff` attributes and NUL bytes, --remerge-diff shows lines a merge adds (octopus merges fail the job).
        # Not scanned: archives, Git LFS objects and submodule contents (only pointers/SHAs are in history).
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: |
          # Bootstrap only: a base without an ignore file falls back to this checkout's.
          git show "$BASE:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore" 2>/dev/null \
            || git show HEAD:.gitleaksignore > "$RUNNER_TEMP/gitleaksignore" 2>/dev/null \
            || : > "$RUNNER_TEMP/gitleaksignore"
          rm -f .gitleaks.toml .gitleaksignore
          # gitleaks passes with "0 commits scanned" if git rejects a log option: fail loudly instead.
          git --version
          git log -n1 --text --no-textconv --remerge-diff > /dev/null
          # remerge-diff skips octopus merges, so their content would go unscanned.
          octo=$(git rev-list --all --min-parents=3 -n1)
          [ -z "$octo" ] || { echo "::error::octopus merge $octo; its content cannot be scanned"; exit 1; }
          ./gitleaks git . --log-opts="--all --text --no-textconv --remerge-diff" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" --ignore-gitleaks-allow --redact --no-banner --exit-code 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
