name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload the .mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Tag matches package, plugin and mcpb versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const v = (f) => JSON.parse(fs.readFileSync(f, "utf8")).version;
            const want = process.env.TAG.replace(/^v/, "");
            const got = { "package.json": v("package.json"), ".claude-plugin/plugin.json": v(".claude-plugin/plugin.json"), "manifest.json": v("manifest.json") };
            const bad = Object.entries(got).filter(([, x]) => x !== want);
            if (bad.length) { console.error(`tag ${process.env.TAG} != ${JSON.stringify(Object.fromEntries(bad))}`); process.exit(1); }
          '
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/smoke-launch.mjs
      - run: npm run pack:mcpb
      - name: Publish the release with the .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/agent-kb.mcpb --repo "$GITHUB_REPOSITORY" --title "agent-kb $TAG" --generate-notes --verify-tag
